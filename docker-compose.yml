version: '3.8'

services:
  voice_frontend:
    build: 
      context: ./frontend-react
      args:
        - VITE_API_URL=https://voice-backend.marketbytes.in
        - VITE_WS_URL=wss://voice-backend.marketbytes.in
    container_name: voice_frontend
    restart: always
    ports:
      - "3010:80"
    
  voice_backend:
    build: ./backend
    container_name: voice_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deployment environment}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3010,http://127.0.0.1:3010}
    ports:
      - "127.0.0.1:8010:8010"
    networks:
      - default
      - shared-db-network

networks:
  default:
  shared-db-network:
    external: true
